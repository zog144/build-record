name: test

on:
  push:
    branches:
      - unstable
      - main
  pull_request:
    branches:
      - unstable
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify clean public source and licensing
        run: |
          test ! -e COPYRIGHT
          test ! -e AGENTS.md
          test ! -e publication
          test ! -e tools
          test -f LICENSE
          test -f THIRD-PARTY-NOTICES.md
          test -f LICENSES/BSD-3-Clause.txt
          test -f LICENSES/GPL-3.0-only.txt
      - name: Install package
        run: python -m pip install .

      - name: Verify installed namespace
        working-directory: /tmp
        run: |
          python - <<'PY'
          import importlib.util
          import zog.build_record
          from zog.build_record.cli import main

          assert zog.build_record.__version__ == "0.8.2"
          assert callable(main)
          assert importlib.util.find_spec("build_record") is None
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
